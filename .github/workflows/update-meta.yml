
name: Mise à jour des statistiques Overwatch

on:
  # Exécution automatique tous les jours à 6h UTC
  schedule:
    - cron: "0 6 * * *"

  # Permet de lancer le workflow manuellement
  workflow_dispatch:

# Autorise GitHub Actions à modifier les fichiers du dépôt
permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      # Récupération du contenu du dépôt
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Installation de Node.js
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Exécution du script JavaScript
      - name: Récupérer les statistiques
        run: node scripts/update-meta.js

      # Enregistrement des nouveaux fichiers JSON
      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/meta.json data/meta-diamond.json

          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour des statistiques Overwatch"
            git push
          else
            echo "Aucune modification des statistiques."
          fi
