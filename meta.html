
<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WikiWatch - Meta Overwatch</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/meta.css" />

    <script src="js/meta.js" defer></script>
</head>

<body>

    <header>

        <img
            src="photo/icons/Overwatch_circle_logo.svg.webp"
            width="50"
            height="50"
            alt="Logo Overwatch"
        />

        <div>
            <h1>
                <span class="wiki">Wiki</span><span class="watch">Watch</span>
            </h1>
        </div>

        <nav>
            <a href="./heros.html">HÉROS</a>
            <a href="./map.html">MAPS</a>
            <a href="./index.html">ACCUEIL</a>
            <a href="./compo.html">COMPO</a>
        </nav>

    </header>

    <main>

        <section class="meta-section">

        <div class="meta-filtres">

            <div class="filtre">
                <label for="filtre-rang">Rang</label>
                <select id="filtre-rang">
                    <option value="all">Tous les rangs</option>
                    <option value="diamond">Diamant</option>
                </select>
            </div>

            <div class="filtre">
                <label for="filtre-role">Rôle</label>
                <select id="filtre-role">
                    <option value="all">Tous les rôles</option>
                    <option value="TANK">Tank</option>
                    <option value="DAMAGE">Dégâts</option>
                    <option value="SUPPORT">Support</option>
                </select>
            </div>

            <div class="filtre">
                <label for="tri-statistique">Trier par</label>
                <select id="tri-statistique">
                    <option value="winRate">Win rate</option>
                    <option value="pickRate">Pick rate</option>
                    <option value="banRate">Ban rate</option>
                </select>
            </div>

            <div class="filtre recherche">
                <label for="recherche-hero">Rechercher</label>
                <input
                    type="search"
                    id="recherche-hero"
                    placeholder="Nom du héros..."
                />
            </div>

        </div>

        <p id="meta-statut" aria-live="polite"></p>

        <div id="classement-heros"></div>

    </section>

    </main>

</body>
</html>
