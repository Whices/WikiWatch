
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Overwatch Heroes</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="entete">
        <h1>OVERWATCH <span>HEROES</span></h1>
        <p>Découvre tous les héros et leurs capacités.</p>
    </header>

    <main>
        <input
            type="search"
            id="recherche"
            placeholder="Rechercher un héros..."
            aria-label="Rechercher un héros"
        >

        <p id="message">Chargement des héros...</p>

        <section id="heros" class="grille-heros"></section>

        <section id="fiche" class="fiche" hidden>
            <button id="fermer" type="button">✕ Fermer la fiche</button>
            <div id="details"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
