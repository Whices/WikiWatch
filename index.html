
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Overwatch Heroes</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img src="photo/icons/Overwatch_circle_logo.svg.webp" width="50px" height="50px">
        <div>
            <h1><span class="wiki">Wiki</span><span class="watch">Watch</span></h1>
        </div>
        <nav>
            <a href="./index.html">HÉROS</a>
            <a href="./index.html">MAPS</a>
            <a href="./index.html">MÉTA</a>
            <a href="./index.html">COMPO</a> 
        </nav>
    </header>

    <main>
        <input
            type="search"
            id="recherche"
            placeholder="Rechercher un héros..."
            aria-label="Rechercher un héros"
        >

        <p id="message">Chargement des héros...</p>

        <section id="heros" class="grille-heros"></section>

        <section id="fiche" class="fiche" hidden>
            <button id="fermer" type="button">✕ Fermer la fiche</button>
            <div id="details"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
